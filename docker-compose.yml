services:
  backend:
    build:
      context: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - SECRET_KEY=django-insecure-test-key-12345
      - ALLOWED_HOSTS=*
      - DB_NAME=beautifulmind
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - ORCHESTRATOR_SERVICE_URL=http://orchestrator:8000
    depends_on:
      - db
    # connsects to orchestrator

  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=beautifulmind
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
  ai:
    build:
      context: ./ai
    ports:
      - "8001:8000"
    environment:
      - OPENAI_API_KEY=/run/secrets/openai_api_key
      - OPENAI_CHAT_MODEL=gpt-4o-mini
      - OPENAI_STT_MODEL=whisper-1
    secrets:
      - openai_api_key

  orchestrator:
    build:
      context: ./orchestrator
    ports:
      - "8002:8000"
    environment:
      - AI_SERVICE_URL=http://ai:8000
      - BACKEND_SERVICE_URL=http://backend:8000
      - WHATSAPP_SERVICE_URL=http://whatsapp:8000
      - META_HANDSHAKE_SECRET=/run/secrets/meta_handshake_secret
      - APP_DOMAIN=https://beautifulmind.health
    secrets:
      - meta_handshake_secret
    # no start up dependency
    # connects with ai, backend, and whatsapp

  whatsapp:
    build:
      context: ./whatsapp
    ports:
      - "8003:8000"
    environment:
      - ORCHESTRATOR_SERVICE_URL=http://orchestrator:8000
      - META_API_KEY_FILE=/run/secrets/meta_api_key
      - META_HANDSHAKE_SECRET=/run/secrets/meta_handshake_secret
      - META_WHATSAPP_ID=/run/secrets/meta_whatsapp_id
    secrets:
      - meta_api_key
      - meta_handshake_secret
      - meta_whatsapp_id
    # no start up dependency
    # connects with orchestrator

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - webroot:/var/www/certbot
    depends_on:
      - frontend
      - whatsapp
    restart: always

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - webroot:/var/www/certbot

  certbot-renew:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

secrets:
  openai_api_key:
    file: ./secrets/openai_api_key.txt
  meta_api_key:
    file: ./secrets/meta_api_key.txt
  meta_handshake_secret:
    file: ./secrets/meta_handshake_secret.txt
  meta_whatsapp_id:
    file: ./secrets/meta_whatsapp_id.txt

volumes:
  postgres_data:
  certbot-etc:
  certbot-var:
  webroot:


